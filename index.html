<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>筋トレ管理アプリ</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f5f9;
      --card: #ffffff;
      --line: #d7deea;
      --text: #1d2433;
      --muted: #5f6b83;
      --accent: #2f6ef9;
      --danger: #d64545;
      --ok: #1f9d58;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      background: linear-gradient(180deg, #eff3ff 0%, var(--bg) 100%);
      color: var(--text);
    }

    .app {
      max-width: 980px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.4rem, 2vw + 1rem, 2rem);
    }

    .sub {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .grid {
      margin-top: 18px;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 8px 20px rgba(24, 47, 109, 0.06);
      padding: 14px;
    }

    .card h2 {
      margin: 2px 0 12px;
      font-size: 1.1rem;
    }

    label {
      display: block;
      margin: 10px 0 6px;
      font-weight: 600;
      font-size: 0.9rem;
    }

    input, textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 11px;
      font-size: 0.95rem;
      color: var(--text);
      background: #fff;
    }

    textarea { min-height: 68px; resize: vertical; }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary { background: var(--accent); color: #fff; }
    .ghost { background: #e9eefc; color: #284890; }
    .danger { background: #ffe5e5; color: var(--danger); }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(120px, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }

    .stat {
      background: #f8faff;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
    }

    .stat .k { color: var(--muted); font-size: 0.82rem; }
    .stat .v { font-size: 1.35rem; font-weight: 800; margin-top: 2px; }

    .list {
      display: grid;
      gap: 10px;
    }

    .item {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      background: #fff;
    }

    .item-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
    }

    .item-title {
      margin: 0;
      font-size: 1.05rem;
    }

    .meta {
      color: var(--muted);
      font-size: 0.86rem;
      margin-top: 4px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 2px 9px;
      font-size: 0.78rem;
      font-weight: 700;
      border: 1px solid;
    }

    .tag.done {
      color: var(--ok);
      border-color: #a8e7c3;
      background: #ebfff3;
    }

    .tag.todo {
      color: #906625;
      border-color: #f2d9aa;
      background: #fff7e8;
    }

    .item-actions { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
    .item-actions button { font-size: 0.82rem; padding: 8px 10px; }

    .empty {
      border: 1px dashed var(--line);
      border-radius: 12px;
      padding: 18px;
      text-align: center;
      color: var(--muted);
      background: #fbfcff;
    }

    @media (max-width: 860px) {
      .grid { grid-template-columns: 1fr; }
      .stats { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>筋トレ管理アプリ</h1>
    <p class="sub">種目ごとの回数・重量・メモを記録して、日々のトレーニングを見える化します。</p>

    <section class="grid">
      <article class="card">
        <h2 id="formTitle">メニューを追加</h2>
        <form id="workoutForm">
          <label for="name">種目名</label>
          <input id="name" name="name" required placeholder="例: ベンチプレス" />

          <div class="row">
            <div>
              <label for="sets">セット数</label>
              <input id="sets" name="sets" type="number" min="1" required value="3" />
            </div>
            <div>
              <label for="reps">回数（1セット）</label>
              <input id="reps" name="reps" type="number" min="1" required value="10" />
            </div>
          </div>

          <div class="row">
            <div>
              <label for="weight">重量 (kg)</label>
              <input id="weight" name="weight" type="number" min="0" step="0.5" value="0" />
            </div>
            <div>
              <label for="date">実施日</label>
              <input id="date" name="date" type="date" required />
            </div>
          </div>

          <label for="note">メモ</label>
          <textarea id="note" name="note" placeholder="フォームや体調など"></textarea>

          <div class="btn-row">
            <button class="primary" type="submit" id="submitBtn">追加する</button>
            <button class="ghost" type="button" id="cancelEditBtn" hidden>編集をキャンセル</button>
          </div>
        </form>
      </article>

      <article class="card">
        <h2>記録一覧</h2>
        <div class="stats">
          <div class="stat"><div class="k">総メニュー数</div><div class="v" id="totalCount">0</div></div>
          <div class="stat"><div class="k">完了数</div><div class="v" id="doneCount">0</div></div>
          <div class="stat"><div class="k">推定総挙上量(kg)</div><div class="v" id="volume">0</div></div>
        </div>

        <div class="btn-row" style="margin-bottom: 12px;">
          <button class="ghost" id="sortBtn" type="button">日付で並び替え（新しい順）</button>
          <button class="danger" id="clearBtn" type="button">全件削除</button>
        </div>

        <div class="list" id="workoutList"></div>
      </article>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "workout-tracker-v1";
    const state = {
      workouts: [],
      editingId: null,
      sortDesc: true,
    };

    const form = document.getElementById("workoutForm");
    const formTitle = document.getElementById("formTitle");
    const submitBtn = document.getElementById("submitBtn");
    const cancelEditBtn = document.getElementById("cancelEditBtn");
    const workoutList = document.getElementById("workoutList");
    const totalCount = document.getElementById("totalCount");
    const doneCount = document.getElementById("doneCount");
    const volume = document.getElementById("volume");
    const sortBtn = document.getElementById("sortBtn");
    const clearBtn = document.getElementById("clearBtn");

    function setToday() {
      if (!form.date.value) {
        const today = new Date().toISOString().slice(0, 10);
        form.date.value = today;
      }
    }

    function escapeHTML(str = "") {
      return str
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function loadWorkouts() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        state.workouts = saved ? JSON.parse(saved) : [];
      } catch {
        state.workouts = [];
      }
    }

    function saveWorkouts() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.workouts));
    }

    function formatDate(dateString) {
      const date = new Date(dateString);
      if (Number.isNaN(date.getTime())) return "日付不明";
      return date.toLocaleDateString("ja-JP", {
        year: "numeric",
        month: "short",
        day: "numeric",
      });
    }

    function calcVolume(item) {
      return item.sets * item.reps * item.weight;
    }

    function renderStats() {
      totalCount.textContent = String(state.workouts.length);
      const done = state.workouts.filter((item) => item.done).length;
      doneCount.textContent = String(done);
      const totalVolume = Math.round(
        state.workouts.reduce((sum, item) => sum + calcVolume(item), 0)
      );
      volume.textContent = totalVolume.toLocaleString("ja-JP");
    }

    function getSortedWorkouts() {
      const clone = [...state.workouts];
      clone.sort((a, b) => {
        const timeA = new Date(a.date).getTime();
        const timeB = new Date(b.date).getTime();
        return state.sortDesc ? timeB - timeA : timeA - timeB;
      });
      return clone;
    }

    function renderList() {
      const items = getSortedWorkouts();

      if (!items.length) {
        workoutList.innerHTML = '<div class="empty">まだ記録がありません。左のフォームから追加してください。</div>';
        return;
      }

      workoutList.innerHTML = items
        .map((item) => `
          <article class="item">
            <div class="item-head">
              <h3 class="item-title">${escapeHTML(item.name)}</h3>
              <span class="tag ${item.done ? "done" : "todo"}">${item.done ? "完了" : "未完了"}</span>
            </div>
            <div class="meta">${formatDate(item.date)} ・ ${item.sets}セット × ${item.reps}回 ・ ${item.weight}kg</div>
            ${item.note ? `<div class="meta">メモ: ${escapeHTML(item.note)}</div>` : ""}
            <div class="meta">推定挙上量: ${Math.round(calcVolume(item)).toLocaleString("ja-JP")}kg</div>
            <div class="item-actions">
              <button class="ghost" type="button" onclick="toggleDone('${item.id}')">${item.done ? "未完了に戻す" : "完了にする"}</button>
              <button class="ghost" type="button" onclick="startEdit('${item.id}')">編集</button>
              <button class="danger" type="button" onclick="removeWorkout('${item.id}')">削除</button>
            </div>
          </article>
        `)
        .join("");
    }

    function resetForm() {
      form.reset();
      setToday();
      state.editingId = null;
      formTitle.textContent = "メニューを追加";
      submitBtn.textContent = "追加する";
      cancelEditBtn.hidden = true;
    }

    function upsertWorkout(payload) {
      if (state.editingId) {
        state.workouts = state.workouts.map((item) =>
          item.id === state.editingId ? { ...item, ...payload } : item
        );
      } else {
        state.workouts.unshift({
          ...payload,
          id: crypto.randomUUID(),
          done: false,
          createdAt: new Date().toISOString(),
        });
      }

      saveWorkouts();
      render();
      resetForm();
    }

    function render() {
      renderStats();
      renderList();
      sortBtn.textContent = `日付で並び替え（${state.sortDesc ? "新しい順" : "古い順"}）`;
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const payload = {
        name: form.name.value.trim(),
        sets: Number(form.sets.value),
        reps: Number(form.reps.value),
        weight: Number(form.weight.value || 0),
        date: form.date.value,
        note: form.note.value.trim(),
      };

      if (!payload.name || payload.sets < 1 || payload.reps < 1 || !payload.date) {
        alert("入力内容を確認してください。");
        return;
      }

      upsertWorkout(payload);
    });

    sortBtn.addEventListener("click", () => {
      state.sortDesc = !state.sortDesc;
      render();
    });

    clearBtn.addEventListener("click", () => {
      if (!state.workouts.length) return;
      if (!confirm("記録をすべて削除します。よろしいですか？")) return;
      state.workouts = [];
      saveWorkouts();
      render();
      resetForm();
    });

    cancelEditBtn.addEventListener("click", resetForm);

    window.startEdit = (id) => {
      const item = state.workouts.find((x) => x.id === id);
      if (!item) return;
      state.editingId = id;
      form.name.value = item.name;
      form.sets.value = item.sets;
      form.reps.value = item.reps;
      form.weight.value = item.weight;
      form.date.value = item.date;
      form.note.value = item.note || "";
      formTitle.textContent = "メニューを編集";
      submitBtn.textContent = "更新する";
      cancelEditBtn.hidden = false;
      window.scrollTo({ top: 0, behavior: "smooth" });
    };

    window.removeWorkout = (id) => {
      const item = state.workouts.find((x) => x.id === id);
      if (!item) return;
      if (!confirm(`「${item.name}」を削除しますか？`)) return;
      state.workouts = state.workouts.filter((x) => x.id !== id);
      saveWorkouts();
      if (state.editingId === id) resetForm();
      render();
    };

    window.toggleDone = (id) => {
      state.workouts = state.workouts.map((item) =>
        item.id === id ? { ...item, done: !item.done } : item
      );
      saveWorkouts();
      render();
    };

    loadWorkouts();
    setToday();
    render();
  </script>
</body>
</html>
